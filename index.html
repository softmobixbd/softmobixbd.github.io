                <div id="seconds" class="text-2xl md:text-4xl font-bold text-[#5396b3]">00</div>
                <div class="text-[10px] md:text-xs tracking-wider uppercase text-slate-500 font-semibold mt-1">Secs</div>
            </div>
        </div>

        <form id="notify-form" class="max-w-md mx-auto w-full px-2">
            <div class="flex flex-col sm:flex-row gap-2.5 bg-slate-900/40 p-2 border border-slate-800 rounded-xl sm:rounded-full backdrop-blur-md focus-within:border-[#5396b3]/50 transition-all duration-300">
                <input type="email" placeholder="Enter your email address" required
                    class="bg-transparent text-white placeholder-slate-500 px-4 py-3 w-full rounded-full focus:outline-none text-sm">
                <button type="submit" 
                    class="bg-[#5396b3] hover:bg-[#42819c] text-white font-medium text-sm px-6 py-3 rounded-xl sm:rounded-full whitespace-nowrap shadow-lg shadow-[#5396b3]/20 transition-all duration-300 transform active:scale-95">
                    Notify Me
                </button>
            </div>
            <p id="form-message" class="text-xs text-emerald-400 mt-3 hidden"><i class="fa-solid fa-circle-check mr-1"></i> Thank you! We'll keep you updated.</p>
        </form>
    </main>

    <footer class="w-full max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 border-t border-slate-900 pt-6 z-10 text-xs text-slate-500">
        <div>
            &copy; 2026 SoftMobiXBD. All rights reserved.
        </div>
        <div class="flex gap-4 text-base">
            <a href="#" class="hover:text-[#5396b3] transition-colors duration-200"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" class="hover:text-[#5396b3] transition-colors duration-200"><i class="fa-brands fa-linkedin"></i></a>
            <a href="#" class="hover:text-[#5396b3] transition-colors duration-200"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="hover:text-[#5396b3] transition-colors duration-200"><i class="fa-regular fa-envelope"></i></a>
        </div>
    </footer>

    <script>
        // Set your target launch date here (Format: "Month Day, Year HH:MM:SS")
        const launchDate = new Date("July 31, 2026 00:00:00").getTime();

        const countdownFunction = setInterval(() => {
            const now = new Date().getTime();
            const distance = launchDate - now;

            // Calculations for days, hours, minutes, and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display values inside HTML elements
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // Handle when countdown ends
            if (distance < 0) {
                clearInterval(countdownFunction);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
            }
        }, 1000);

        // Simple mock response for form interaction
        document.getElementById('notify-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const message = document.getElementById('form-message');
            message.classList.remove('hidden');
            this.reset();
            setTimeout(() => {
                message.classList.add('hidden');
            }, 5000);
        });
    </script>
</body>
